name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No continue-on-error: a lockfile that cannot install is a failure,
      # not a warning.
      - run: npm ci

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

      # The 1.x tarball shipped tests/ (with a live API key) and src/.
      # Fail the build if anything outside dist/ and the docs sneaks back in.
      - name: Verify package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map(f => f.path);
            const allowed = /^(dist\/|README\.md$|LICENSE$|NOTICE$|CHANGELOG\.md$|package\.json$)/;
            const bad = files.filter(f => !allowed.test(f));
            if (bad.length) {
              console.error("Unexpected files in package tarball:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            if (!files.some(f => f === "dist/index.js")) {
              console.error("dist/index.js missing from tarball");
              process.exit(1);
            }
            console.log("tarball contents OK (" + files.length + " files)");
          '
