# Contract test against a real Intempt environment.
#
# Everything else in CI is offline: unit tests use nock, and the integration and
# consumer suites use a local HTTP server. Neither proves the API *accepts* what
# we send. This job is the only thing that does.
#
# It is not on the PR path, because it writes real events into a real project and
# needs a credential. Run it manually, or let the nightly schedule catch drift in
# the ingestion contract.
#
# Required repository secrets:
#   INTEMPT_E2E_API_KEY    a PUBLIC key for a throwaway staging project
#   INTEMPT_E2E_ORG
#   INTEMPT_E2E_PROJECT
#   INTEMPT_E2E_SOURCE_ID
# Optional:
#   INTEMPT_E2E_HOST       defaults to api.staging.intempt.com
#   INTEMPT_E2E_FEED_ID
name: E2E (staging)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Skip rather than fail when the secret is absent, so a fork or a repo
      # without staging credentials does not show a permanently red schedule.
      - name: Check for credentials
        id: creds
        env:
          KEY: ${{ secrets.INTEMPT_E2E_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::INTEMPT_E2E_API_KEY is not set; skipping the E2E contract test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run contract test
        if: steps.creds.outputs.present == 'true'
        env:
          INTEMPT_HOST: ${{ secrets.INTEMPT_E2E_HOST || 'api.staging.intempt.com' }}
          INTEMPT_ORG: ${{ secrets.INTEMPT_E2E_ORG }}
          INTEMPT_PROJECT: ${{ secrets.INTEMPT_E2E_PROJECT }}
          INTEMPT_API_KEY: ${{ secrets.INTEMPT_E2E_API_KEY }}
          INTEMPT_SOURCE_ID: ${{ secrets.INTEMPT_E2E_SOURCE_ID }}
          INTEMPT_FEED_ID: ${{ secrets.INTEMPT_E2E_FEED_ID }}
        run: npm run test:e2e
