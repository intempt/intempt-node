# Publishes only on a version tag.
#
# The old workflow ran `npm publish` on every push to main, which fails when the
# version is unchanged. That failed silently for 21 months: the repo carried
# RecommendationClient and the product methods while npm still served 1.0.1.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Re-publishes a tag whose tag-push run failed. The run uses this file from the
  # branch it is started on, and builds the given tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v3.0.1'
        required: true

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    # GitHub-hosted on purpose, the only job in this repo that is: npm refuses
    # trusted publishing and provenance from self-hosted runners (E422
    # "Unsupported GitHub Actions runner environment: self-hosted", v3.0.1).
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # generate-changelog.sh needs tag history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # OIDC trusted publishing needs a recent npm CLI (support landed in
      # npm 11.5+); the version bundled with setup-node's node-version: '22'
      # predates that. Same fix as packages/mcp in the cli repo, same reason:
      # npm's bypass-2FA-token deprecation (gh.io/npm-gat-bypass2fa-deprecation)
      # closed the token-based path for CI publishing entirely.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm run check-format

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

      # A tag that disagrees with package.json means someone tagged the wrong
      # commit. Publishing it would put a mislabelled artifact on npm forever.
      - name: Verify tag matches package.json
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version $PKG"

      - name: Generate release notes
        id: notes
        run: |
          .github/scripts/generate-changelog.sh "$RELEASE_TAG" \
            "https://github.com/${GITHUB_REPOSITORY}" > release-notes.md
          cat release-notes.md

      # No NODE_AUTH_TOKEN / NPM_TOKEN -- OIDC trusted publishing, registered
      # on npm as: GitHub Actions, intempt/intempt-node, workflow release.yml,
      # action "npm publish". --provenance now rides the same OIDC token this
      # job already requests via `id-token: write` above.
      - run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
